name: iOS
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Build unsigned device IPA
        run: |
          mkdir -p reports
          set -o pipefail
          npm run ios:package 2>&1 | tee reports/ios-package.log
      - name: Retain IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-${{ github.sha }}
          path: |
            reports/ios/PouroverWizard.ipa
            reports/ios/PouroverWizard.ipa.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Retain build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-log-${{ github.sha }}
          path: reports/ios-package.log
          retention-days: 7
          if-no-files-found: warn
  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-${{ github.sha }}
          path: ipa
      - name: Attach the IPA to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$draft" = false ]; then
            echo "::error::Release $TAG is already published and immutable; push a new tag."
            exit 1
          fi
          [ "$draft" = true ] || gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --generate-notes --notes "Unsigned iOS build for SideStore. Verify the SHA-256 before importing."
          gh release upload "$TAG" --repo "$REPO" --clobber ipa/PouroverWizard.ipa ipa/PouroverWizard.ipa.sha256
          gh release edit "$TAG" --repo "$REPO" --draft=false
